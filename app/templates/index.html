{% extends "base.html" %}

{% block titulo %}
Catálogo
{% endblock %}

{% block contenido %}

<h2>Nuestra colección</h2>

<div class="catalogo"> 

{% for producto in productos %}

<div class="card">

<img src="{{ url_for('static', filename=producto.foto) }}" alt="{{ producto.nombre }}">

<h3>{{ producto.nombre }}</h3>

<p>{{ producto.marca }}</p>

<p><strong>${{ producto.precio }}</strong></p>

<a href="{{ url_for('main.detalle', sku=producto.sku) }}">
Ver detalle
</a>

</div>

{% endfor %}

</div>

{% endblock %}
